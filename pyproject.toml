[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "beat-slideshow-mcp"
version = "0.1.0"
description = "节拍卡点图文视频生成 MCP Server（工程骨架）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp==1.9.4",
    "pydantic==2.11.4",
    "librosa==0.11.0",
    "numpy==2.2.6",
    "jinja2==3.1.6",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
